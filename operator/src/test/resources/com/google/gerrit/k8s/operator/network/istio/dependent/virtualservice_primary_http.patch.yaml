- op: add
  path: /spec/http/-
  value:
    name: forbidden-routes-primary
    route:
    - destination:
        port:
          number: 48080
        host: primary-service.gerrit.svc.cluster.local
    match:
    - uri:
        regex: "^(/a)?/plugins/high-availability/.*$"
    fault:
      abort:
        percentage:
          value: 100.0
        httpStatus: 403
- op: add
  path: /spec/http/-
  value:
    name: gerrit-primary-primary
    route:
    - destination:
        port:
          number: 48080
        host: primary-service.gerrit.svc.cluster.local
