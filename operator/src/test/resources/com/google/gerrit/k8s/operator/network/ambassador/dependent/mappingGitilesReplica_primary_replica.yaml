apiVersion: getambassador.io/v2
kind: Mapping
metadata:
  name: gerrit-mapping-gitiles-replica
  namespace: gerrit
spec:
  ambassador_id:
    - my-id-1
    - my-id-2
  bypass_auth: true
  rewrite: ""
  host: example.com
  prefix: /plugins/gitiles/
  service: replica-service.gerrit.svc.cluster.local:48080
