- op: add
  path: /spec/template/spec/tolerations
  value:
  - key: key1
    operator: Equal
    value: value1
    effect: NoSchedule
- op: add
  path: /spec/template/spec/topologySpreadConstraints
  value:
  - maxSkew: 1
    topologyKey: zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        foo: bar
- op: add
  path: /spec/template/spec/affinity
  value:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: disktype
            operator: In
            values:
            - ssd
- op: add
  path: /spec/template/spec/priorityClassName
  value: prio
- op: add
  path: /spec/template/spec/containers/0/resources
  value:
    requests:
      cpu: 1
      memory: 5Gi
    limits:
      cpu: 1
      memory: 6Gi
- op: replace
  path: /spec/template/spec/containers/0/readinessProbe
  value:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 1
    successThreshold: 1
    failureThreshold: 3
- op: replace
  path: /spec/template/spec/containers/0/livenessProbe
  value:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 1
    successThreshold: 1
    failureThreshold: 3
