image:
  repository: docker.io/k8sgerrit/gerrit-operator
  tag: latest
  imagePullPolicy: Always
  imagePullSecrets: []
  # - name: my-secret-1

# Install the Gerrit CRDs along with the operator
installCRDs: true

# Configuration passed to the gerrit-operator-crds subchart.
# Versions of the CRDs to install. Defaults to all available versions so that
# upgrades from any supported predecessor work out of the box. Restrict to a
# single version to reduce storage or limit the installed API surface.
gerrit-operator-crds:
  versions:
    - v1beta21
    - v1beta20
  # The version designated as the storage version (stored in etcd). Defaults to
  # the first (most current) entry in `versions` when left empty.
  storageVersion: ""

ingress:
  # Which ingress provider to use (options: NONE, INGRESS, ISTIO, AMBASSADOR)
  type: NONE
  # Restrict which namespaces the operator watches for Emissary-ingress Mapping
  # resources. If empty or unset, the operator watches all namespaces.
  # emissaryIngressNamespaces:
  #   - namespace_name

# What cluster domain to use for generated resources
clusterDomain: cluster.local

## Required to use an external/persistent keystore, otherwise a keystore using
## self-signed certificates will be generated
externalKeyStore:
  enabled: false
  # base64-encoded Java keystore
  jks: ""
  # Java keystore password (not base64-encoded)
  password: ""

cluster:
  mode: HIGH_AVAILABILITY

# Additional configuration for the operator Deployment
deployment:
  annotations: {}
  labels: {}
  pod:
    annotations: {}
    labels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Commented out to enable a seamless transition. This causes the operator to use
# the default configuration.
# TODO(Thomas): Uncomment in v1beta21, since this is only required for the upgrade
# between v1beta19 and v1beta20

config:
  enableValidatingWebhook: true
