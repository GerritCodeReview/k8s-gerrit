{{- $versions := (index .Values "gerrit-operator-crds").versions -}}
{{- if $versions -}}
apiVersion: "gerritoperator.google.com/{{ first $versions }}"
kind: GerritOperatorConfig
metadata:
  name: gerrit-operator-cfg
  namespace: {{ .Release.Namespace }}
spec:
  {{- with .Values.config }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
